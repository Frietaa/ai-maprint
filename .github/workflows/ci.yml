# MABA PRINTING — continuous integration (Architecture §55, TASK-08.07).
#
# Runs every check of `npm run verify` plus the browser suites against an
# EPHEMERAL PostgreSQL service. No production database, no repository
# secrets: the database credentials below are synthetic and exist only
# inside this throwaway CI container.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maba_ci
          POSTGRES_PASSWORD: maba_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maba_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The test-database guard accepts only a loopback host and the name
      # maba_printing_test.
      TEST_DATABASE_URL: postgresql://maba_ci:maba_ci_password@localhost:5432/maba_printing_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Applied migrations unchanged
        run: npm run check:migrations

      - name: Prisma schema valid
        run: npm run db:validate

      - name: Unit tests
        run: npm test

      - name: Fresh database from migrations
        run: npm run db:test:rebuild

      - name: No drift between migrations and schema
        working-directory: apps/api
        run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end (dev server)
        run: npm run test:e2e

      - name: End-to-end (production build with security headers)
        run: npm run test:e2e:preview -w @maba-printing/web

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image (runtime and migrate targets)
        run: |
          docker build -f apps/api/Dockerfile -t maba-printing-api:ci .
          docker build -f apps/api/Dockerfile --target migrate -t maba-printing-api-migrate:ci .

      - name: The runtime image refuses local storage in production
        run: |
          set +e
          output=$(docker run --rm -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/x -e SESSION_SECRET=ci-synthetic-session-secret-0123456789 maba-printing-api:ci 2>&1)
          status=$?
          set -e
          echo "$output" | grep -q 'STORAGE_PROVIDER "local" is for development only'
          test "$status" -ne 0
