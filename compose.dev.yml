# MABA PRINTING — LOCAL DEVELOPMENT database only. Not for production.
#
# Credentials below are synthetic, local-only development values.
# Start:  npm run db:start    Status: npm run db:status    Stop: npm run db:stop
name: maba-printing

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: maba_dev
      POSTGRES_PASSWORD: maba_dev_password
      POSTGRES_DB: maba_printing_dev
    ports:
      # Loopback only: not reachable from other machines on the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maba_dev -d maba_printing_dev']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  # Named volume: data persists across stop/start and container recreation.
  postgres-data:
